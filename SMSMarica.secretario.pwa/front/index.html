<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem ele o iOS não expõe env(safe-area-inset-*) e a
         faixa vermelha não alcança a barra de status. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C8102E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Painel Saúde" />
    <!-- translucent: a faixa vermelha do header sobe até a barra de status do iPhone
         (o Header reserva o espaço com env(safe-area-inset-top)). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Painel executivo da Secretaria de Saúde de Maricá — o pulso do Hospital Conde Modesto Leal, ao vivo."
    />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Painel da Saúde — Maricá</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

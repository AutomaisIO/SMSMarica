name: Deploy SMSMais.aiengine

on:
  push:
    branches: [main]
    paths:
      - 'SMSMais.aiengine/**'
      - '.github/workflows/deploy-aiengine.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-smsmarica-aiengine
  cancel-in-progress: false

jobs:
  deploy:
    # Publica na VM SMSMAIS-01 (EVEO) pelo GitHub Environment `automais`, o mesmo do
    # deploy-server: DEPLOY_HOST/USER/KEY + var DEPLOY_PORT (SSH pela WAN). Até 21/10/2026 usava
    # os secrets HOST/USER/PASS_SMSMARICA do droplet, desligado na virada de 14/10.
    environment: automais
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack artifact
        run: |
          tar -czf smsmarica-aiengine.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='venv' --exclude='.venv' \
            -C SMSMais.aiengine .
          ls -la smsmarica-aiengine.tar.gz

      - name: Copy artifact to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          source: smsmarica-aiengine.tar.gz
          target: /tmp/

      - name: Deploy on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        env:
          AIENGINE_KEY: ${{ secrets.AIENGINE_INTERNAL_KEY }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          envs: AIENGINE_KEY,CLAUDE_TOKEN
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR=/opt/smsmarica-aiengine
            ENV_DIR=/etc/smsmarica-aiengine
            ENV_FILE=$ENV_DIR/env
            DATA_DIR=/var/lib/smsmarica-aiengine
            SERVICE=smsmarica-aiengine
            TARBALL=/tmp/smsmarica-aiengine.tar.gz

            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            log() { echo ">>> $*"; }

            # --- 1. Validar o artefato ANTES de destruir o que está no ar ---
            if [ ! -f "$TARBALL" ]; then
              echo "ERRO: $TARBALL não encontrado (scp falhou?)" >&2
              exit 1
            fi
            tar -tzf "$TARBALL" >/dev/null || { echo "ERRO: tarball corrompido" >&2; exit 1; }

            # --- 2. Python (este é o PRIMEIRO serviço Python neste host) ---
            if ! command -v python3 >/dev/null 2>&1; then
              $SUDO apt-get update -y
              $SUDO apt-get install -y python3
            fi
            if ! dpkg -s python3-venv >/dev/null 2>&1; then
              log "Instalando python3-venv..."
              $SUDO apt-get update -y
              $SUDO apt-get install -y python3-venv python3-pip
            fi

            # Sandbox do modo `dados` (chat de dados): cwd ISOLADO, fora do repo, onde a sessão
            # restrita do Claude Code trabalha sem ter o código sequer no diretório.
            $SUDO mkdir -p "$APP_DIR" "$ENV_DIR" "$DATA_DIR" "$DATA_DIR/dados-sandbox"

            # Token do proxy SQL interno da API .NET: FONTE ÚNICA é /etc/smsmarica-server/proxy-sql.env
            # (escrito pela fiação do ProxySql). Reusamos aqui para o tool `consultar_base` do modo
            # `dados` — assim o token não é duplicado num Secret e acompanha o do server.
            PROXY_TOKEN="$(sed -n 's/^ProxySql__Token=//p' /etc/smsmarica-server/proxy-sql.env 2>/dev/null || true)"
            if [ -z "$PROXY_TOKEN" ]; then
              echo "AVISO: ProxySql__Token não encontrado em /etc/smsmarica-server/proxy-sql.env — o chat de dados não conseguirá consultar (o Agente IA segue normal)." >&2
            fi

            # --- 3. Arquivo de ambiente ---
            # O env do servidor é a FONTE DA VERDADE (21/10/2026, como no deploy-server): o deploy
            # só acerta as linhas que ele controla e preserva o resto. Antes o tee recriava o
            # arquivo inteiro a partir dos Secrets — um token da assinatura renovado à mão no
            # servidor voltaria ao do secret e derrubaria o Agente IA. O SQLite fica em $DATA_DIR,
            # FORA de $APP_DIR, porque o passo 5 apaga o app inteiro.
            definir_env() {
              local tmp
              tmp=$(mktemp)
              $SUDO touch "$ENV_FILE"
              $SUDO cp -p "$ENV_FILE" "$ENV_FILE.bak-deploy"
              $SUDO grep -v "^$1=" "$ENV_FILE" > "$tmp" || true
              printf '%s=%s\n' "$1" "$2" >> "$tmp"
              $SUDO tee "$ENV_FILE" < "$tmp" >/dev/null
              rm -f "$tmp"
            }
            # Só acrescenta quando a linha não existe: o valor que está no servidor manda.
            se_faltar_env() {
              $SUDO touch "$ENV_FILE"
              if ! $SUDO grep -q "^$1=" "$ENV_FILE"; then
                printf '%s=%s\n' "$1" "$2" | $SUDO tee -a "$ENV_FILE" >/dev/null
              fi
            }
            # A chave interna tem de ser a MESMA do lado da API, e o deploy-server grava lá a do
            # secret a cada deploy — por isso esta vem do secret (iguais em 21/10/2026).
            if [ -n "${AIENGINE_KEY:-}" ]; then definir_env AIENGINE_INTERNAL_KEY "$AIENGINE_KEY"; fi
            se_faltar_env CLAUDE_CODE_OAUTH_TOKEN "${CLAUDE_TOKEN:-}"
            definir_env AIENGINE_DB_PATH "$DATA_DIR/aiengine.db"
            definir_env AIENGINE_REPO_DIR /srv/smsmarica-repo
            definir_env AIENGINE_DADOS_CWD "$DATA_DIR/dados-sandbox"
            definir_env AIENGINE_PROXYSQL_URL http://127.0.0.1:5091/proxy-sql
            if [ -n "$PROXY_TOKEN" ]; then definir_env AIENGINE_PROXYSQL_TOKEN "$PROXY_TOKEN"; fi
            $SUDO chmod 600 "$ENV_FILE"

            if [ -z "${AIENGINE_KEY:-}" ]; then
              echo "AVISO: secret AIENGINE_INTERNAL_KEY vazio — o serviço não vai subir." >&2
            fi
            if ! $SUDO grep -q '^CLAUDE_CODE_OAUTH_TOKEN=.' "$ENV_FILE"; then
              echo "AVISO: CLAUDE_CODE_OAUTH_TOKEN vazio no $ENV_FILE — sem credencial da assinatura." >&2
            fi

            # --- 4. Backup do que está no ar (rollback) ---
            if [ -d "$APP_DIR" ] && [ -n "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
              $SUDO rm -rf "$APP_DIR.old"
              $SUDO cp -a "$APP_DIR" "$APP_DIR.old"
            fi

            if $SUDO systemctl is-active --quiet "$SERVICE"; then
              log "Parando $SERVICE..."
              $SUDO systemctl stop "$SERVICE"
            fi

            # --- 5. Substituir artefatos ---
            log "Extraindo nova versão em $APP_DIR..."
            $SUDO find "$APP_DIR" -mindepth 1 -delete
            $SUDO tar -xzf "$TARBALL" -C "$APP_DIR"
            rm -f "$TARBALL"

            # --- 6. venv (recriado sempre; evita venv quebrado após upgrade de Python) ---
            log "Recriando venv..."
            $SUDO rm -rf "$APP_DIR/venv"
            $SUDO python3 -m venv "$APP_DIR/venv"
            $SUDO "$APP_DIR/venv/bin/pip" install --upgrade pip --quiet
            $SUDO "$APP_DIR/venv/bin/pip" install -r "$APP_DIR/requirements.txt" --quiet

            # --- 7. Unit ---
            if [ -f "$APP_DIR/deploy/$SERVICE.service" ]; then
              $SUDO cp "$APP_DIR/deploy/$SERVICE.service" "/etc/systemd/system/$SERVICE.service"
              $SUDO chmod 644 "/etc/systemd/system/$SERVICE.service"
            fi
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable "$SERVICE" || true

            # O binário `claude` é instalado à mão (deploy/setup-aiengine-host.sh).
            if [ ! -x /root/.local/bin/claude ]; then
              echo "AVISO: /root/.local/bin/claude ausente — o serviço sobe mas toda sessão falha." >&2
            fi
            if [ ! -d /srv/smsmarica-repo/.git ]; then
              echo "AVISO: /srv/smsmarica-repo não existe — agente entra em MODO DEGRADADO (sem código)." >&2
            fi

            # --- 8. Subir e validar, com rollback ---
            log "Iniciando $SERVICE..."
            $SUDO systemctl start "$SERVICE"
            # Instância TRAVADA (ConditionPathExists=/etc/smsmais/liberado da virada não satisfeita):
            # o artefato foi atualizado, mas o serviço não deve subir — não é falha (como no deploy-server).
            if [ "$($SUDO systemctl show -p ConditionResult --value "$SERVICE")" = "no" ]; then
              log "Instância TRAVADA (condição da unit não satisfeita): artefato atualizado, serviço não iniciado."
              exit 0
            fi
            sleep 5
            if ! $SUDO systemctl is-active --quiet "$SERVICE"; then
              echo "FALHA: serviço não subiu. Journal:" >&2
              $SUDO journalctl -u "$SERVICE" -n 80 --no-pager || true
              if [ -d "$APP_DIR.old" ]; then
                echo "Revertendo para a versão anterior..." >&2
                $SUDO find "$APP_DIR" -mindepth 1 -delete
                $SUDO cp -a "$APP_DIR.old/." "$APP_DIR/"
                $SUDO systemctl start "$SERVICE" || true
              fi
              exit 1
            fi

            log "OK — $SERVICE ativo."
            curl -fsS --max-time 10 http://127.0.0.1:5085/health || true
            echo

name: Build iOS SMSMais.cidadao.app

# Compila o app do cidadão para iPhone num Mac do GitHub. O repositório é público, então o runner
# macOS padrão não gasta minutos do plano. Por enquanto SEM assinatura: prova que o código iOS
# compila a cada PR que mexe no app. Quando a conta Apple da AutoMais for aprovada, este workflow
# ganha a assinatura e o envio ao TestFlight (com segredos, só em execução manual).
#
# Repositório público = log e artefatos visíveis a qualquer um: nada de segredo em `echo`, e o
# .ipa/símbolos nunca sobem como artefato aberto.

on:
  pull_request:
    paths:
      - 'SMSMais.cidadao.app/**'
      - '.github/workflows/build-cidadao-ios.yml'
  workflow_dispatch: {}

concurrency:
  group: build-cidadao-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: SMSMais.cidadao.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O Xcode estável mais novo do runner: é o que a App Store exige no envio.
      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # A mesma versão do Flutter usada para gerar o .aab do Android.
      - name: Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Versões
        run: |
          xcodebuild -version
          flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Build iOS (sem assinatura)
        run: flutter build ios --release --no-codesign

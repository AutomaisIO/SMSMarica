name: Deploy Automais.Fhir (API)

# Cutover feito (ADR-0010): o schema fhir antigo foi dropado e o serviço é dono
# exclusivo dele. Deploy automático no push ao Automais.Fhir/**. O serviço
# auto-provisiona o schema + migrations no startup.
on:
  push:
    branches: [main]
    paths:
      - 'Automais.Fhir/**'
      - '.github/workflows/deploy-fhir.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-automais-fhir
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: Automais.Fhir
        run: dotnet restore

      # Gate antes de publicar: nada sobe sem a suíte verde. Os testes de banco usam
      # Testcontainers, que funciona direto no runner do GitHub (tem Docker) — não precisa
      # de serviço nem de secret. Na máquina de dev, que não tem Docker, a mesma suíte roda
      # apontando FHIR_TESTS_CONNECTION para a bancada.
      - name: Testes
        working-directory: Automais.Fhir
        run: dotnet test --configuration Release

      - name: Publish (framework-dependent, linux-x64)
        working-directory: Automais.Fhir
        run: |
          dotnet publish src/Automais.Fhir.Api/Automais.Fhir.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --no-self-contained \
            --output publish

      - name: Pack artifact
        working-directory: Automais.Fhir
        run: tar -czf ../automais-fhir.tar.gz -C publish .

      - name: Copy artifact to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_SMSMARICA }}
          username: ${{ secrets.USER_SMSMARICA }}
          password: ${{ secrets.PASS_SMSMARICA }}
          port: 22
          source: automais-fhir.tar.gz
          target: /tmp/

      - name: Deploy on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Mesmo cluster Postgres do smsmarica (schema fhir é separado no código).
          DB_CS: ${{ secrets.DB_CONNECTION_SMSMARICA }}
        with:
          host: ${{ secrets.HOST_SMSMARICA }}
          username: ${{ secrets.USER_SMSMARICA }}
          password: ${{ secrets.PASS_SMSMARICA }}
          port: 22
          envs: DB_CS
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR=/opt/automais-fhir/api
            ENV_DIR=/etc/automais-fhir
            ENV_FILE=$ENV_DIR/env
            SERVICE=automais-fhir
            DOTNET_DIR=/opt/dotnet
            DOTNET=$DOTNET_DIR/dotnet
            DOTNET_LINK=/usr/local/bin/dotnet
            TARBALL=/tmp/automais-fhir.tar.gz

            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi

            log() { echo ">>> $*"; }

            # --- 1. Dependências básicas ---
            if ! command -v curl >/dev/null 2>&1; then
              $SUDO apt-get update -y && $SUDO apt-get install -y curl
            fi
            if ! command -v tar >/dev/null 2>&1; then
              $SUDO apt-get install -y tar
            fi

            # --- 2. .NET 10 ASP.NET Core runtime (compartilhado com o smsmarica) ---
            if [ ! -x "$DOTNET" ] || ! "$DOTNET" --list-runtimes 2>/dev/null | grep -q 'Microsoft.AspNetCore.App 10'; then
              log "Instalando .NET 10 ASP.NET Core runtime..."
              curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              chmod +x /tmp/dotnet-install.sh
              $SUDO mkdir -p "$DOTNET_DIR"
              $SUDO /tmp/dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir "$DOTNET_DIR"
              $SUDO ln -sf "$DOTNET" "$DOTNET_LINK"
              rm -f /tmp/dotnet-install.sh
            fi

            # --- 3. Usuário de sistema dedicado ---
            if ! id -u automais >/dev/null 2>&1; then
              $SUDO useradd --system --home-dir /opt/automais-fhir --shell /usr/sbin/nologin automais
            fi

            # --- 4. Diretórios ---
            $SUDO mkdir -p "$APP_DIR" "$ENV_DIR"

            # --- 5. Arquivo de ambiente (connection string FhirDb) ---
            if [ -n "${DB_CS:-}" ]; then
              log "Atualizando $ENV_FILE com ConnectionStrings__FhirDb..."
              printf 'ConnectionStrings__FhirDb=%s\n' "$DB_CS" | $SUDO tee "$ENV_FILE" >/dev/null
            elif [ ! -f "$ENV_FILE" ]; then
              log "AVISO: DB_CONNECTION_SMSMARICA não setado e $ENV_FILE não existe — serviço subirá sem banco."
              $SUDO touch "$ENV_FILE"
            fi
            $SUDO chmod 600 "$ENV_FILE"
            $SUDO chown automais:automais "$ENV_FILE"

            # --- 6. Systemd unit (porta 5081 para não colidir com smsmarica-server:5080) ---
            UNIT_FILE=/etc/systemd/system/$SERVICE.service
            if [ ! -f "$UNIT_FILE" ]; then
              log "Criando unit $UNIT_FILE..."
              $SUDO tee "$UNIT_FILE" >/dev/null <<'UNIT'
            [Unit]
            Description=Automais FHIR (API .NET)
            After=network.target

            [Service]
            WorkingDirectory=/opt/automais-fhir/api
            ExecStart=/usr/local/bin/dotnet /opt/automais-fhir/api/Automais.Fhir.Api.dll
            Restart=on-failure
            RestartSec=10
            KillSignal=SIGINT
            SyslogIdentifier=automais-fhir
            User=automais
            Group=automais
            EnvironmentFile=/etc/automais-fhir/env
            Environment=ASPNETCORE_ENVIRONMENT=Production
            Environment=ASPNETCORE_URLS=http://0.0.0.0:5081
            Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false

            [Install]
            WantedBy=multi-user.target
            UNIT
              $SUDO systemctl daemon-reload
              $SUDO systemctl enable "$SERVICE"
            fi

            # --- 7. Parar serviço + GARANTIR a porta 5081 livre (robusto) ---
            # NÃO usar pkill -f com o nome da DLL: casaria com o shell deste
            # script (que contém a string) e mataria a sessão SSH (SIGTERM 143).
            $SUDO systemctl stop "$SERVICE" 2>/dev/null || true
            # fuser (psmisc) mata por porta — instala se faltar (causa de deploys
            # anteriores falharem: instância antiga seguia presa na 5081).
            if ! command -v fuser >/dev/null 2>&1; then
              $SUDO apt-get update -y >/dev/null 2>&1 || true
              $SUDO apt-get install -y psmisc >/dev/null 2>&1 || true
            fi
            for _ in $(seq 1 15); do
              $SUDO fuser -k 5081/tcp 2>/dev/null || true
              sleep 1
              if ! $SUDO fuser 5081/tcp >/dev/null 2>&1; then break; fi
            done

            # --- 8. Substituir artefatos ---
            if [ ! -f "$TARBALL" ]; then
              echo "ERRO: $TARBALL não encontrado (scp falhou?)" >&2
              exit 1
            fi
            log "Extraindo nova versão em $APP_DIR..."
            $SUDO find "$APP_DIR" -mindepth 1 -delete
            $SUDO tar -xzf "$TARBALL" -C "$APP_DIR"
            $SUDO chown -R automais:automais "$APP_DIR"
            rm -f "$TARBALL"

            # --- 9. Iniciar ---
            log "Iniciando $SERVICE..."
            $SUDO systemctl start "$SERVICE"

            # --- 10. Validação ---
            sleep 4
            if ! $SUDO systemctl is-active --quiet "$SERVICE"; then
              echo "FALHA: serviço não subiu. Journal:" >&2
              $SUDO journalctl -u "$SERVICE" -n 80 --no-pager || true
              exit 1
            fi
            log "OK — $SERVICE ativo na porta 5081."
            $SUDO systemctl status "$SERVICE" --no-pager --lines=10 || true

name: Deploy SMSMarica.secretario.pwa

# Painel executivo público do Secretário de Saúde (secretario.smsmarica.online).
# Dois jobs independentes: back (.NET, porta 5090, systemd smsmarica-secretario)
# e front (estático em /var/www/smsmarica-secretario, servido pelo nginx).
# O env file /etc/smsmarica-secretario/env contém o token do proxy SQL interno
# (colocado manualmente 1x) e NUNCA é sobrescrito pelo deploy. O painel não guarda
# credencial de banco: fala com Oracle e SQL Server pelo proxy do smsmarica.
on:
  push:
    branches: [main]
    paths:
      - 'SMSMarica.secretario.pwa/**'
      # Editar só documentação não reimplanta produção.
      - '!SMSMarica.secretario.pwa/docs/**'
      - '.github/workflows/deploy-secretario.yml'
  workflow_dispatch: {}

jobs:
  deploy-back:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-secretario-back
      cancel-in-progress: false
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: SMSMarica.secretario.pwa/back
        run: dotnet restore

      - name: Publish (framework-dependent, linux-x64)
        working-directory: SMSMarica.secretario.pwa/back
        run: |
          dotnet publish SMSMarica.Secretario.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --no-self-contained \
            --output publish

      - name: Pack artifact
        working-directory: SMSMarica.secretario.pwa/back
        run: tar -czf ../../smsmarica-secretario-api.tar.gz -C publish .

      - name: Copy artifact to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_SMSMARICA }}
          username: ${{ secrets.USER_SMSMARICA }}
          password: ${{ secrets.PASS_SMSMARICA }}
          port: 22
          source: smsmarica-secretario-api.tar.gz
          target: /tmp/

      - name: Deploy on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_SMSMARICA }}
          username: ${{ secrets.USER_SMSMARICA }}
          password: ${{ secrets.PASS_SMSMARICA }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR=/opt/smsmarica-secretario/api
            ENV_DIR=/etc/smsmarica-secretario
            ENV_FILE=$ENV_DIR/env
            SERVICE=smsmarica-secretario
            DOTNET_DIR=/opt/dotnet
            DOTNET=$DOTNET_DIR/dotnet
            DOTNET_LINK=/usr/local/bin/dotnet
            TARBALL=/tmp/smsmarica-secretario-api.tar.gz

            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi

            log() { echo ">>> $*"; }

            # --- 1. Dependências básicas ---
            if ! command -v curl >/dev/null 2>&1; then
              $SUDO apt-get update -y && $SUDO apt-get install -y curl
            fi
            if ! command -v tar >/dev/null 2>&1; then
              $SUDO apt-get install -y tar
            fi

            # --- 2. .NET 10 ASP.NET Core runtime (compartilhado: /opt/dotnet) ---
            if [ ! -x "$DOTNET" ] || ! "$DOTNET" --list-runtimes 2>/dev/null | grep -q 'Microsoft.AspNetCore.App 10'; then
              log "Instalando .NET 10 ASP.NET Core runtime..."
              curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              chmod +x /tmp/dotnet-install.sh
              $SUDO mkdir -p "$DOTNET_DIR"
              $SUDO /tmp/dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir "$DOTNET_DIR"
              $SUDO ln -sf "$DOTNET" "$DOTNET_LINK"
              rm -f /tmp/dotnet-install.sh
            fi

            # --- 3. Usuário de sistema dedicado ---
            if ! id -u secretario >/dev/null 2>&1; then
              $SUDO useradd --system --home-dir /opt/smsmarica-secretario --shell /usr/sbin/nologin secretario
            fi

            # --- 4. Diretórios ---
            $SUDO mkdir -p "$APP_DIR" "$ENV_DIR"

            # --- 5. Arquivo de ambiente ---
            # NUNCA sobrescrever: contém a credencial Oracle do Salux, colocada
            # manualmente 1x pelo operador (ver docs/runbook-producao.md).
            if [ ! -f "$ENV_FILE" ]; then
              log "AVISO: $ENV_FILE não existe — criando VAZIO. O serviço subirá sem Oracle."
              log "AVISO: preencha as variáveis Salux__* conforme o runbook e reinicie o serviço."
              $SUDO touch "$ENV_FILE"
              $SUDO chmod 600 "$ENV_FILE"
              $SUDO chown root:root "$ENV_FILE"
            else
              log "Env file existente preservado ($ENV_FILE) — deploy nunca o sobrescreve."
            fi

            # --- 6. Systemd unit (porta 5090, só loopback — o nginx expõe) ---
            UNIT_FILE=/etc/systemd/system/$SERVICE.service
            if [ ! -f "$UNIT_FILE" ]; then
              log "Criando unit $UNIT_FILE..."
              $SUDO tee "$UNIT_FILE" >/dev/null <<'UNIT'
            [Unit]
            Description=SMSMarica Secretario (API .NET do painel executivo)
            After=network.target

            [Service]
            WorkingDirectory=/opt/smsmarica-secretario/api
            ExecStart=/usr/local/bin/dotnet /opt/smsmarica-secretario/api/SMSMarica.Secretario.Api.dll
            Restart=on-failure
            RestartSec=10
            KillSignal=SIGINT
            SyslogIdentifier=smsmarica-secretario
            User=secretario
            Group=secretario
            StateDirectory=smsmarica-secretario
            EnvironmentFile=/etc/smsmarica-secretario/env
            Environment=ASPNETCORE_ENVIRONMENT=Production
            Environment=ASPNETCORE_URLS=http://127.0.0.1:5090
            Environment=Painel__SnapshotPath=/var/lib/smsmarica-secretario/snapshot-painel.json
            Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false

            [Install]
            WantedBy=multi-user.target
            UNIT
              $SUDO systemctl daemon-reload
              $SUDO systemctl enable "$SERVICE"
            fi

            # --- 7. Parar serviço + GARANTIR a porta 5090 livre (robusto) ---
            # NÃO usar pkill -f com o nome da DLL: casaria com o shell deste
            # script (que contém a string) e mataria a sessão SSH (SIGTERM 143).
            $SUDO systemctl stop "$SERVICE" 2>/dev/null || true
            # fuser (psmisc) mata por porta — instala se faltar.
            if ! command -v fuser >/dev/null 2>&1; then
              $SUDO apt-get update -y >/dev/null 2>&1 || true
              $SUDO apt-get install -y psmisc >/dev/null 2>&1 || true
            fi
            for _ in $(seq 1 15); do
              $SUDO fuser -k 5090/tcp 2>/dev/null || true
              sleep 1
              if ! $SUDO fuser 5090/tcp >/dev/null 2>&1; then break; fi
            done

            # --- 8. Substituir artefatos ---
            if [ ! -f "$TARBALL" ]; then
              echo "ERRO: $TARBALL não encontrado (scp falhou?)" >&2
              exit 1
            fi
            log "Extraindo nova versão em $APP_DIR..."
            $SUDO find "$APP_DIR" -mindepth 1 -delete
            $SUDO tar -xzf "$TARBALL" -C "$APP_DIR"
            $SUDO chown -R secretario:secretario "$APP_DIR"
            rm -f "$TARBALL"

            # --- 9. Iniciar ---
            log "Iniciando $SERVICE..."
            $SUDO systemctl start "$SERVICE"

            # --- 10. Validação ---
            sleep 4
            if ! $SUDO systemctl is-active --quiet "$SERVICE"; then
              echo "FALHA: serviço não subiu. Journal:" >&2
              $SUDO journalctl -u "$SERVICE" -n 80 --no-pager || true
              exit 1
            fi
            # is-active pode dar falso verde em crash tardio — exigir o /health
            # respondendo no loopback (até ~30 s de tolerância pro bind).
            SAUDE=falhou
            for _ in $(seq 1 15); do
              if curl -fsS --max-time 3 http://127.0.0.1:5090/health >/dev/null 2>&1; then
                SAUDE=ok; break
              fi
              sleep 2
            done
            if [ "$SAUDE" != ok ]; then
              echo "FALHA: /health não respondeu na 5090. Journal:" >&2
              $SUDO journalctl -u "$SERVICE" -n 80 --no-pager || true
              exit 1
            fi
            log "OK — $SERVICE ativo na porta 5090 (loopback), /health respondendo."
            $SUDO systemctl status "$SERVICE" --no-pager --lines=10 || true

  deploy-front:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-secretario-front
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: SMSMarica.secretario.pwa/front/package-lock.json

      - name: Install
        working-directory: SMSMarica.secretario.pwa/front
        run: npm ci --no-audit --no-fund

      # O front usa fetch same-origin em /api (proxy nginx → 127.0.0.1:5090).
      # Não há VITE_API_BASE_URL nem qualquer segredo de build.
      - name: Build
        working-directory: SMSMarica.secretario.pwa/front
        run: npm run build

      - name: Pack artifact
        working-directory: SMSMarica.secretario.pwa/front
        run: tar -czf ../../smsmarica-secretario-front.tar.gz -C dist .

      - name: Copy artifact to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_SMSMARICA }}
          username: ${{ secrets.USER_SMSMARICA }}
          password: ${{ secrets.PASS_SMSMARICA }}
          port: 22
          source: smsmarica-secretario-front.tar.gz
          target: /tmp/

      - name: Deploy on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_SMSMARICA }}
          username: ${{ secrets.USER_SMSMARICA }}
          password: ${{ secrets.PASS_SMSMARICA }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail

            DEPLOY_DIR=/var/www/smsmarica-secretario
            TARBALL=/tmp/smsmarica-secretario-front.tar.gz

            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi

            log() { echo ">>> $*"; }

            if [ ! -f "$TARBALL" ]; then
              echo "ERRO: $TARBALL não encontrado (scp falhou?)" >&2
              exit 1
            fi

            if ! command -v tar >/dev/null 2>&1; then
              $SUDO apt-get update -y
              $SUDO apt-get install -y tar
            fi

            # Deploy atômico: extrai em pasta nova e troca, preservando a anterior como .old.
            NEW_DIR="${DEPLOY_DIR}.new"
            OLD_DIR="${DEPLOY_DIR}.old"

            log "Preparando $NEW_DIR..."
            $SUDO rm -rf "$NEW_DIR"
            $SUDO mkdir -p "$NEW_DIR"
            $SUDO tar -xzf "$TARBALL" -C "$NEW_DIR"

            if getent group www-data >/dev/null 2>&1; then
              $SUDO chown -R www-data:www-data "$NEW_DIR"
            fi
            $SUDO find "$NEW_DIR" -type d -exec chmod 755 {} \;
            $SUDO find "$NEW_DIR" -type f -exec chmod 644 {} \;

            log "Trocando $DEPLOY_DIR pela nova versão..."
            $SUDO rm -rf "$OLD_DIR"
            if [ -d "$DEPLOY_DIR" ]; then
              $SUDO mv "$DEPLOY_DIR" "$OLD_DIR"
            else
              $SUDO mkdir -p "$(dirname "$DEPLOY_DIR")"
            fi
            $SUDO mv "$NEW_DIR" "$DEPLOY_DIR"

            rm -f "$TARBALL"

            log "OK — conteúdo atual em $DEPLOY_DIR:"
            $SUDO ls -la "$DEPLOY_DIR" | head -20

            # SPA/PWA é estático — nginx não precisa reload.

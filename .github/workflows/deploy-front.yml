name: Deploy SMSMais.front

on:
  push:
    branches: [main]
    paths:
      - 'SMSMais.front/**'
      - '.github/workflows/deploy-front.yml'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    # Uma execução por INSTÂNCIA (ADR-0043/0046) — mesmos nomes de secret/var em cada
    # GitHub Environment; fail-fast off: a falha de um município não trava o outro.
    strategy:
      fail-fast: false
      matrix:
        instancia: [marica, ccdti]
    runs-on: ubuntu-latest
    environment: ${{ matrix.instancia }}
    concurrency:
      group: deploy-front-${{ matrix.instancia }}
      cancel-in-progress: false
    env:
      # URL base da API desta instância — OBRIGATÓRIA desde o ADR-0043 (uma instância por
      # município). Não há mais fallback: o build falha se ela vier vazia.
      #
      # Antes, vazio significava "cai no default do httpClient", que era
      # `https://api.smsmarica.online`. Isso é aceitável enquanto só existe Maricá e vira
      # uma bomba no dia em que existir a segunda prefeitura: o painel dela apontaria,
      # em silêncio, para o backend de Maricá.
      #
      # Valor para Maricá: https://api.smsmarica.online
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: SMSMais.front/package-lock.json

      # Falha ANTES do npm ci (que leva minutos) com uma mensagem que diz o que fazer.
      # Sem isto, o erro só apareceria no meio do log do Vite.
      - name: Conferir VITE_API_BASE_URL
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::Secret VITE_API_BASE_URL do environment não está definido."
            echo "Cada instância aponta para o próprio backend (ADR-0043) e não há default."
            echo "Defina o secret no repositório com a URL da API desta instância."
            echo "Maricá: https://api.smsmarica.online"
            exit 1
          fi
          echo "API base: $VITE_API_BASE_URL"

      - name: Install
        working-directory: SMSMais.front
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: SMSMais.front
        run: npm run build

      - name: Pack artifact
        working-directory: SMSMais.front
        run: tar -czf ../smsmais-front.tar.gz -C dist .

      - name: Copy artifact to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          source: smsmais-front.tar.gz
          target: /tmp/

      - name: Deploy on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        env:
          I_DEPLOY_DIR: ${{ vars.DEPLOY_DIR_FRONT }}
        with:
          envs: I_DEPLOY_DIR
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail

            # Publicado em subdiretório de /var/www para não colidir com outros sites.
            # Ajuste se quiser servir em /var/www/ direto — mas cuidado com o nginx default.
            DEPLOY_DIR=${I_DEPLOY_DIR:?var DEPLOY_DIR_FRONT do environment ausente}
            TARBALL=/tmp/smsmais-front.tar.gz

            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi

            log() { echo ">>> $*"; }

            if [ ! -f "$TARBALL" ]; then
              echo "ERRO: $TARBALL não encontrado (scp falhou?)" >&2
              exit 1
            fi

            if ! command -v tar >/dev/null 2>&1; then
              $SUDO apt-get update -y
              $SUDO apt-get install -y tar
            fi

            # Deploy atômico: extrai em pasta nova e troca, preservando a anterior
            # como .old para rollback manual rápido.
            NEW_DIR="${DEPLOY_DIR}.new"
            OLD_DIR="${DEPLOY_DIR}.old"

            log "Preparando $NEW_DIR..."
            $SUDO rm -rf "$NEW_DIR"
            $SUDO mkdir -p "$NEW_DIR"
            $SUDO tar -xzf "$TARBALL" -C "$NEW_DIR"

            # Ajusta dono para www-data quando existir (padrão nginx/apache no Ubuntu/Debian).
            if getent group www-data >/dev/null 2>&1; then
              $SUDO chown -R www-data:www-data "$NEW_DIR"
            fi
            $SUDO find "$NEW_DIR" -type d -exec chmod 755 {} \;
            $SUDO find "$NEW_DIR" -type f -exec chmod 644 {} \;

            log "Trocando $DEPLOY_DIR pela nova versão..."
            $SUDO rm -rf "$OLD_DIR"
            if [ -d "$DEPLOY_DIR" ]; then
              $SUDO mv "$DEPLOY_DIR" "$OLD_DIR"
            else
              $SUDO mkdir -p "$(dirname "$DEPLOY_DIR")"
            fi
            $SUDO mv "$NEW_DIR" "$DEPLOY_DIR"

            rm -f "$TARBALL"

            log "OK — conteúdo atual em $DEPLOY_DIR:"
            $SUDO ls -la "$DEPLOY_DIR" | head -20

            # SPA é estático — nginx/apache não precisam reload.
            # Se houver cache de CDN/reverse-proxy, invalide separadamente.

name: agente
description: "App do agente de transporte sanitario - SMS Marica (Android only)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  permission_handler: ^11.3.1
  # --- GPS / rastreamento do veículo (envio periódico de posição) ---
  geolocator: ^13.0.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true

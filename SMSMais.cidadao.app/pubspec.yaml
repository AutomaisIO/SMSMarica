name: sms_mais_cidadao
description: "App do Cidadão (Saúde Maricá) — versão nativa do PWA app.smsmarica.online: agenda de consultas e exames, resultados, documentos, transporte e perfil. Login por CPF + código no WhatsApp."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado e navegação
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Sessão e cache local (offline-first, como o PWA)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.6
  # ^7.3.1 e não ^7.3.2: a 7.3.2 puxa dbus 0.8 (só no Linux), que o flutter_local_notifications 22
  # ainda não aceita.
  connectivity_plus: ^7.3.1

  # Interface (mesmos ícones do PWA: lucide; cupertino_icons porque pacotes usam ícones do iOS)
  lucide_icons_flutter: ^3.1.22
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  flutter_widget_from_html_core: ^0.17.4

  # Documentos: visualizador de PDF embutido, compartilhar, anexar
  pdfrx: ^2.4.7
  share_plus: ^12.0.2
  file_picker: ^10.2.4
  image_picker: ^1.2.4
  crop_your_image: ^2.0.1
  image: ^4.10.1

  # Utilidades
  intl: ^0.20.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

  # Notificações (push pelo Firebase; a local mostra o aviso com o app aberto no Android).
  # flutter_local_notifications com teto: a 23 exige compileSdk 37 e AGP 9.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ">=22.3.1 <23.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Mesmas famílias do PWA (fontsource). Pesos fixos gerados do arquivo variável do Google
    # Fonts: o Flutter não aplica o eixo `wght` pelo FontWeight em todas as plataformas.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    # `font-mono` do PWA (Cartão SUS, chave de acesso, código de teste): o "monospace" do sistema
    # não existe em todo aparelho (nem na web), então vai empacotada.
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700

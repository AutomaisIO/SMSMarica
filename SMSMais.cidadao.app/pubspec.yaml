name: sms_mais_cidadao
description: "App cidadão do SMSMais"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  cupertino_icons: ^1.0.8

  # HTTP
  dio: ^5.7.0

  # Utilities
  equatable: ^2.0.7

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Storage
  flutter_secure_storage: ^9.2.2

  # Models / JSON
  freezed_annotation: ^2.4.4

  # Navigation
  go_router: ^14.6.2

  intl: ^0.20.1
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.3

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3

  # Lints
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
